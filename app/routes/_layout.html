<script server>
  import { site, nav } from "../data/site.js";
  import { unwritten } from "../data/timeline.js";

  /**
   * Wraps every page. It loads once per request and the page below it can read
   * what it returned through `ctx.layout`.
   */
  export default async ({ route, absolute }) => {
    const path = route.path;

    // The timeline is the front page and also everything under /era and /log,
    // because those are the same document read at a different depth.
    const owns = (href) =>
      href === "/"
        ? path === "/" || path.startsWith("/era") || path.startsWith("/log")
        : path.startsWith(href);

    return {
      site,
      nav: nav.map((item) => ({
        ...item,
        current: owns(item.href) ? "page" : false,
      })),
      // The page's own address, for `og:url`. `absolute` resolves against
      // `metadataBase` in the config rather than against the request, because a
      // prerendered page has no request and a proxied one has the wrong origin.
      canonical: absolute(path),
      // Only ever used to nag the author while the site is still being written.
      unwritten: unwritten.length,
      built: new Date().getFullYear(),
    };
  };
</script>

<meta name="description" content="${site.tagline}" />
<meta name="author" content="${site.name}" />
<meta property="og:site_name" content="${site.name}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="${site.name}, ${site.role}" />
<meta property="og:description" content="${site.tagline}" />
<meta property="og:url" content="${canonical}" />
<!-- The card a link preview shows. Without one, LinkedIn and Slack render a
     text-only stub, which is a poor advertisement for a site whose argument is
     that you should go and look at it. Absolute because a scraper does not
     resolve relative paths. -->
<meta property="og:image" content="${site.origin}/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta
  property="og:image:alt"
  content="Fifty years on a screen, in one scroll. 1976 to 2026, 195 entries, 0 bytes of JavaScript."
/>
<meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#111318" />
<!-- The cursor from the first chapter, which is the one image the whole site
     opens on.

     Three formats, because Safari is the reason. It ignores an SVG favicon and
     falls back to /favicon.ico, and it will not read the usual trick of a PNG
     renamed into an ICO container: that file has to be a real BMP icon. The PNG
     link is the belt to that braces. The apple-touch icon is square on purpose,
     since iOS rounds the corners itself and rounding them twice looks like a
     mistake.

     The manifest is there for the icon and nothing else. iOS 16.4 and later
     prefer its icons over the apple-touch link when adding to a home screen,
     and without either it screenshots the page. `display` is `browser` on
     purpose: this is a site to read, and launching it without a URL bar or a
     back button would take away the two controls a reader actually uses. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link
  rel="alternate"
  type="application/rss+xml"
  title="${site.name}"
  href="/feed.xml"
/>

<body class="shell"></body>

<a class="skip-link" href="#main">Skip to the content</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__name" href="/">
      <b>${site.name}</b>
      <span>· ${site.role}</span>
    </a>

    <nav aria-label="Primary">
      <ul class="site-nav" role="list">
        <li each="item of nav">
          <a
            href="${item.href}"
            aria-current="${item.current}"
            title="${item.hint}"
            >${item.label}</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>

<main id="main">
  <slot></slot>
</main>

<footer class="site-footer spread">
  <div class="site-footer__inner">
    <div>
      <h2>The site</h2>
      <ul role="list">
        <li each="item of nav">
          <a href="${item.href}">${item.label}</a>
        </li>
        <li><a href="/feed.xml">Feed</a></li>
      </ul>
    </div>

    <div>
      <h2>Elsewhere</h2>
      <ul role="list">
        <li each="link of site.elsewhere">
          <a href="${link.href}" rel="me">${link.label}</a>
        </li>
      </ul>
    </div>

    <div>
      <h2>Get in touch</h2>
      <ul role="list">
        <li><a href="mailto:${site.email}">${site.email}</a></li>
        <li if="site.location">${site.location}</li>
      </ul>
    </div>

    <p class="site-footer__note">
      <span>
        ${built} ${site.name}. Built with
        <a href="https://transclude.dev">transclude</a>, and no client-side
        JavaScript.
      </span>
      <!-- <span if="site.inProgress" class="wip"
        >${unwritten} entries still to write</span
      > -->
    </p>
  </div>
</footer>
