# Push to main, and the site is live.
#
# The build has to run here rather than being committed: `dist/` is ignored,
# and the worker imports it directly because workerd has no disk to read from.
# So a deploy is always built from the commit being deployed, and it is not
# possible to ship a stale bundle by forgetting to build.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while the first is still deploying should win, not queue.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first. A deploy that fails here never reaches Cloudflare, and
      # `transclude-check` reads the same config the build does, so a broken
      # route or a bad prop is caught before anything ships.
      - run: npm run check

      - run: npm run build

      # Follows every internal link on every page against the built site. The
      # type check cannot see these: a link to a page that does not exist is
      # just a string, and it reaches production silently.
      - run: npm run audit

      # Not `cloudflare/wrangler-action`. That action installs a wrangler of its
      # own, and the one it pinned is older than JSON config support, so it
      # could not read wrangler.jsonc and reported the entry point as missing.
      # The version in package-lock is the version that deploys, which is also
      # the version that runs locally.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
