<!-- Rendered by `npm run social`. Both files here are the source for an image
     that is published somewhere this repository does not control, so they live
     with the source rather than only as a PNG somebody once exported.

     Everything is inline on purpose: no external stylesheet, no webfont, no
     asset. A card that depends on the site running is a card you cannot rebuild
     in two years. The palette is the site's, converted from the oklch tokens to
     hex, because these are rendered once rather than by a browser that knows
     what oklch is. -->
<!-- 1584x396, out: assets/social/linkedin-banner.png -->
<style>
  html,body{margin:0;padding:0}
  body{
    width:1584px;height:396px;background:#07090e;color:#eff2f7;
    font-family:ui-serif,'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    position:relative;overflow:hidden;
  }
  .field{position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,rgba(239,242,247,.05) 0 1px,transparent 1px 4px),
               radial-gradient(70% 130% at 88% 10%,rgba(112,235,236,.18),transparent 68%),
               radial-gradient(50% 110% at 30% 100%,rgba(162,255,177,.07),transparent 70%);}
  .in{position:absolute;left:470px;top:50%;transform:translateY(-50%);z-index:1}
  h1{font-size:62px;line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:0}
  em{font-style:normal;color:#70ebec}
  .url{margin-top:20px;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
    font-size:21px;letter-spacing:.06em;color:#8b8f96}
  .url b{color:#eff2f7;font-weight:500}
</style>
<div class="field"></div>
<div class="in">
  <h1>Fifty years on a screen,<br>in <em>one scroll</em>.</h1>
  <p class="url"><b>dakroub.co</b> · 1976–2026 · 0 bytes of JavaScript</p>
</div>
